<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Payment</title>
	<style>
		.head {
			background-color: rgb(117, 117, 251);
		}
		tr {
			background-color: rgb(249, 214, 249);
		}
		.foot {
			background-color: rgb(245, 106, 245);
		}
	</style>
</head>
<body>
	<table>
		<tr class="head">
			<th>No.</th>
			<th>Name</th>
			<th>Amount</th>
			<th>Price</th>
		</tr>
		<tr>
			<td>1</td>
			<td>Pizza</td>
			<td>1</td>
			<td>$250</td>
		</tr>
		<tr>
			<td>2</td>
			<td rowspan="2">Chicken</td>
			<td>5</td>
			<td>$99</td>
		</tr>
		<tr>
			<td>3</td>
			<td>10</td>
			<td>$169</td>
		</tr>
		<tr>
			<td>4</td>
			<td>Frenchfried</td>
			<td>1</td>
			<td>$259</td>
		</tr>
		<tr>
			<td>5</td>
			<td>Spagetti</td>
			<td>1</td>
			<td>$259</td>
		</tr>
		<tr class="foot">
			<td colspan="3">sum</td>
			<td>$1036</td>
		</tr>
	</table>
</body>
</html>
